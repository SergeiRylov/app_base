[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app_base"
version = "0.0.1"
description = "app_base applicaton for Django Site with AdminLTE4 bootstrap5 framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rs" }]
dependencies = [
    "Django>=6.1"
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-django"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_base = [
    "locale/**/*",
    "management/**/*",
    "migrations/**/*",
    "static/**/*",
    "templates/**/*",
    "templatetags/**/*",
    "py.typed",
]